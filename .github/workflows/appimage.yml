name: Build Fluxer Canary AppImage

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  check:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check if new version available
        id: check
        run: |
          set -eu

          # Read our current version
          LAST_BUILT=""
          [ -f ./LATEST_VERSION ] && LAST_BUILT="$(tr -d '[:space:]' < ./LATEST_VERSION)"
          echo "Current version: ${LAST_BUILT:-<none>}"

          # Download the full tarball and extract just the top-level directory name.
          # The tarball is ~125MB but this runs on GitHub Actions (fast network).
          # We pipe directly from wget to tar and only read the first entry.
          # Using `set +o pipefail` to prevent SIGPIPE from head -1 breaking the script.
          set +o pipefail
          TOP_DIR=$(wget -qO- "https://api.canary.fluxer.app/dl/desktop/canary/linux/x64/latest/tar_gz" | tar tzf - 2>/dev/null | head -1 | cut -d'/' -f1)
          set -o pipefail

          # Clean up any trailing characters
          TOP_DIR=$(echo "$TOP_DIR" | tr -d '[:space:]')
          echo "Tarball top dir: $TOP_DIR"

          # Extract version number from the directory name
          # Format: "Fluxer-Canary-2026.1007.194714-linux-x64"
          if echo "$TOP_DIR" | grep -qP '\d{4}\.\d+\.\d+'; then
              NEW_VERSION=$(echo "$TOP_DIR" | grep -oP '\d{4}\.\d+\.\d+')"-canary"
          else
              # Fallback: use date if we can't parse the version
              NEW_VERSION="$(date +%Y%m%d)-canary"
              echo "WARNING: Could not parse version from '$TOP_DIR', using date: $NEW_VERSION"
          fi
          echo "New version: $NEW_VERSION"

          # Compare versions
          if [ -z "$LAST_BUILT" ]; then
              echo "No previous build, building..."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$NEW_VERSION" != "$LAST_BUILT" ]; then
              echo "New version detected: $NEW_VERSION (was: $LAST_BUILT)"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
              echo "Up to date ($LAST_BUILT), skipping build"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build AppImage
    needs: [check]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Arch Linux container
        uses: pkgforge-dev/anylinux-setup-action@v2

      - name: Build AppImage
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.AppImage.sha256
            dist/appinfo
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release to GitHub
    if: ${{ github.ref_name == 'main' && needs.check.outputs.should_build == 'true' }}
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: AppImage
          merge-multiple: true

      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: "Fluxer Canary ${{ needs.check.outputs.new_version }}"
          release_body: |
            # Fluxer Canary AppImage

            Fluxer Canary packaged using the
            [Anylinux-AppImages](https://github.com/pkgforge-dev/Anylinux-AppImages) methodology.

            ## Features
            - Runs on any Linux distro (glibc, musl, NixOS)
            - No FUSE required (uruntime 0-requirements fallback)
            - All dependencies bundled (libc, ld-linux, mesa, audio, X11, Wayland)
            - Internal auto-updater disabled (updates managed via AppImage self-updater)

            ## Usage
            ```bash
            chmod +x fluxer-canary-*.AppImage
            ./fluxer-canary-x86_64.AppImage
            ```

            ## Auto-update
            Includes `.zsync` for delta updates via AM, soar, or AppImageUpdate.
          release_files: |
            *.AppImage
            *.AppImage.zsync
            *.AppImage.sha256
